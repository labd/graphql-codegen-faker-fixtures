name: PR Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x", "26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: labd/gh-actions-typescript/pnpm-install@ada4548df9a365c62c8b396b583953c6d4bc113f # v1.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format
        id: format
        if: ${{ !cancelled() }}
        run: pnpm format

      - name: Knip
        id: knip
        if: ${{ !cancelled() }}
        run: pnpm lint:knip

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          KNIP: ${{ steps.knip.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ Pass" ;;
              failure) echo "❌ Fail" ;;
              skipped) echo "⏭️ Skip" ;;
              *)       echo "❔ $1" ;;
            esac
          }
          {
            echo "## PR Checks (Node ${{ matrix.node }})"
            echo ""
            echo "| Check     | Result  |"
            echo "| --------- | ------- |"
            echo "| Lint      | $(icon "$LINT") |"
            echo "| Format    | $(icon "$FORMAT") |"
            echo "| Knip      | $(icon "$KNIP") |"
            echo "| Build     | $(icon "$BUILD") |"
            echo "| Typecheck | $(icon "$TYPECHECK") |"
            echo "| Test      | $(icon "$TEST") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
